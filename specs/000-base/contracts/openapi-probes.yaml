openapi: 3.1.0
info:
  title: Security Log Anomaly Detector — sondas (incremento 0)
  version: 0.1.0
paths:
  /health:
    get:
      summary: Proceso vivo (no depende de la base de datos)
      responses:
        "200":
          description: Vivo
          headers: {X-Request-ID: {schema: {type: string}}}
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: {status: {type: string, enum: [ok]}}
  /ready:
    get:
      summary: Listo para recibir tráfico (base de datos accesible)
      responses:
        "200":
          description: Listo
          headers: {X-Request-ID: {schema: {type: string}}}
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: {type: string, enum: [ready]}
                  checks:
                    type: object
                    required: [database]
                    properties: {database: {type: string, enum: [ok]}}
        "503":
          description: No disponible (sobre de error)
          headers: {X-Request-ID: {schema: {type: string}}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorEnvelope"}
              example:
                code: not_ready
                message: El servicio no está listo.
                request_id: 3f6c0d7e-0000-4000-8000-000000000000
                details: {checks: {database: unavailable}}
components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, request_id, details]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string}
        details: {type: object, additionalProperties: true}
