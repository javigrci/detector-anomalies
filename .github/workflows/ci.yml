name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (lint, formato, tipos, tests unitarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Instalar dependencias (lock congelado)
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: mypy
        run: |
          uv run mypy
          uv run mypy tests
      - name: Tests unitarios
        run: uv run pytest -m "not integration"

  integration:
    name: Integración (PostgreSQL 16 real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Base de datos efímera, accesible solo desde el runner: no necesita contraseña.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Instalar dependencias (lock congelado)
        run: uv sync --frozen
      - name: Migraciones (sin revisiones de negocio)
        run: uv run alembic upgrade head
      - name: Tests de integración
        run: uv run pytest -m integration

  compose-smoke:
    name: Prueba de humo (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Preparar .env con una clave temporal
        run: |
          cp .env.example .env
          password="$(openssl rand -hex 12)"
          sed -i "s/change-me-use-a-url-safe-password/${password}/g" .env
      - name: Levantar el entorno completo
        run: docker compose up --build -d --wait
      - name: Comprobar /health y /ready
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
      - name: Logs si falla
        if: failure()
        run: docker compose logs --no-color
      - name: Limpiar
        if: always()
        run: docker compose down -v
