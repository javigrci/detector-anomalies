[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[project]
name = "security-anomaly"
version = "0.1.0"
description = "Detector de anomalías en logs de auditoría de seguridad (prototipo de apoyo al análisis SOC)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9,<3",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2,<4",
    "scikit-learn>=1.9,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["security_anomaly"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requiere servicios externos reales (PostgreSQL); excluir con -m 'not integration'",
]
